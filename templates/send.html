{% extends "base.html" %}
{% block title %}Send Money{% endblock %}
{% block content %}
<div class="card" style="max-width:520px;margin:auto">
  <h2>Send Money</h2>
  <p class="muted">Balance: Tk {{ "{:,.2f}".format(balance) }}</p>
  <form method="post">
    <label>Receiver username</label><input name="receiver" placeholder="e.g. rahim" required>
    <label>Amount (Tk)</label><input name="amount" type="number" step="0.01" min="1" required>
    <label>Device</label>
    <input name="device" list="devs" value="{{ devices[0] if devices else 'Phone-1' }}">
    <datalist id="devs">{% for d in devices %}<option value="{{ d }}">{% endfor %}</datalist>
    <div class="muted">To test a new device, enter a different name (e.g. Phone-X).</div>
    <label>Note (optional)</label><input name="note">
    <br><br><button type="submit">Send</button>
  </form>
</div>
{% endblock %}
